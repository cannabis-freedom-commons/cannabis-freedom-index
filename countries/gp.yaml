name: Guadeloupe
region: North America
iso_numeric: 312
dependency:
  of: fr
  kind: French overseas department
  note: >-
    Guadeloupe is a french overseas department. French national drug law, including the Code de la
    santé publique prohibitions, is the applicable regime; there is no Guadeloupe-specific cannabis
    statute.
recreational: illegal
medical: limited
updated: '2026-11-15'
summary: >-
      French prohibition applies: cannabis use, possession and growing are criminal offences, and the
      only patient route is the restricted national French medical framework. Herb is grown locally
      or brought in from neighbouring islands and is the island's most accessible illegal drug.
scores:
  possession: 1
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Illicit use and possession fall under article L3421-1 of the Code de la santé publique: up
      to one year in prison and a €3,750 fine, with a national fixed-fine procedure for ordinary
      use cases.[@csp,sp_use]
    sources:
      - csp
      - sp_use
    currency: EUR
    penalties:
      - label: Ordinary illicit use
        treatment: criminal
        term: Drug use
        prison: 1 year
        fine: 3750
        note: National fixed-fine procedure applies to ordinary use cases
  cultivation:
    text: >-
      Growing cannabis is treated as production of narcotics: up to 20 years imprisonment and a
      €7.5 million fine, even for a few plants.[@cidj] In practice courts impose far lower
      sentences for small personal grows.[@cidj]
    sources:
      - cidj
    currency: EUR
    penalties:
      - label: Growing cannabis (production of narcotics)
        treatment: criminal
        term: Unlicensed cultivation
        prison: 20 years
        fine: 7500000
        note: Courts impose far lower sentences for small personal grows
  enforcement:
    text: >-
      The national law applies unchanged: ordinary use is handled mainly through fines, with the
      one-year prison maximum remaining available.[@cidj,csp]
    sources:
      - cidj
      - csp
  sharing:
    text: >-
      Giving cannabis to someone for their personal use is a specific offence with up to five
      years in prison under the national regime.[@cidj]
    sources:
      - cidj
  consumption:
    text: >-
      Ordinary illicit use is a criminal offence in public or private, with up to one year and
      €3,750; eligible ordinary-use cases can end through the national fixed-fine
      process.[@csp,sp_use] [France has punished any drug use with up to a year in prison since
      1970.](/history/france-use-criminalised-1970/) [Ordinary use moved into an on-the-spot fine in
      2020.](/history/france-fixed-fine-2020/)
    sources:
      - csp
      - sp_use
  access:
    text: >-
      There is no Guadeloupe-specific patient route; access follows the restricted national French
      medical framework, limited to patients carried over from the 2021 experiment during the
      transition to a permanent regime.[@sp] [France's medical cannabis experiment began in
      2021.](/history/france-medical-experiment-2021/)
    sources:
      - sp
context:
  recreational:
    text: >-
      There is no legal recreational supply. Herbal cannabis is described as the most accessible
      illegal product on the island, sold at urban points of sale and in small towns, through
      apps or among acquaintances, and many users see it as a natural, mild substance.[@ofdt_gp]
      Ordinary illicit use is a criminal offence with up to one year in prison and a €3,750 fine.[@csp]
    sources:
      - ofdt_gp
      - csp
  production:
    status: none
    text: >-
      Herb is grown locally, often in small plantations, or imported from neighbouring islands,
      the Dominican Republic being the most cited; all of it is outside any legal regime, and
      growing is a production offence.[@ofdt_gp,cidj]
    sources:
      - ofdt_gp
      - cidj
  hemp:
    status: standard
    text: >-
      CBD flower and products under 0.3% THC are lawful to sell under the national French
      regime.[@cx] [France's top court allowed CBD flower sales in
      2022.](/history/france-cbd-flower-2022/)
    sources:
      - cx
  medical:
    text: >-
      No Guadeloupe-specific patient route exists; access follows the restricted national French
      medical framework.[@sp]
    sources:
      - sp
  consequences:
    text: >-
      Use and possession convictions carry up to one year in prison and a €3,750 fine under the
      national provisions, with convictions recorded under national criminal-record
      rules.[@csp]
    sources:
      - csp
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Ordinary illicit use is a criminal
      offence punishable by up to one year in prison and a €3,750 fine.[@csp,cidj]
    sources:
      - csp
      - cidj
  black_market:
    text: >-
      Herb is the main form, sold under names such as skunk, creepy and bata skunk; the lowest
      reported price was 4 € a gram (20 € for 5 g), about half the mainland price, with joints
      from 2 €.[@ofdt_gp] Resin is rarer and comes mainly from mainland France, of Moroccan
      origin, sometimes bartered.[@ofdt_gp]
    sources:
      - ofdt_gp
  driving:
    status: zero
    text: >-
      Driving after using a narcotic is an offence whatever the amount; there is no threshold, as
      in the rest of France.[@onisr]
    sources:
      - onisr
sources:
  ofdt_gp:
    title: OFDT — Drogues et conduites addictives en Guadeloupe (June 2026)
    url: https://www.ofdt.fr/publication/2026/drogues-et-conduites-addictives-en-guadeloupe-2691
    locator: >-
      Herb produced locally or imported from neighbouring islands, the Dominican Republic most
      cited; the most accessible illegal product; lowest price 4 € a gram (20 € for 5 g), joints
      from 2 €; resin rarer, mainly from mainland France; strains called skunk, creepy and bata skunk.
  cx:

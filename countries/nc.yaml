  lnc26:
    title: Les Nouvelles Calédoniennes — Deux ans de prison ferme pour une femme qui faisait passer du cannabis au Camp-Est (6 October 2026)
    url: https://www.lnc.nc/print/1432390
  delib26:
    title: Congrès de la Nouvelle-Calédonie — Délibération n° 562 du 5 juin 2026 relative au plan stratégique de structuration de la filière chanvre
    url: https://juridoc.gouv.nc/juridoc/jdtextes.nsf/0/395984df134430db4b258e18000111a1/$file/deliberation_562_05-06-2026_chg.pdf

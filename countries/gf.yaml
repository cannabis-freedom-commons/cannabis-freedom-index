name: French Guiana
region: South America
iso_numeric: 254
dependency:
  of: fr
  kind: French overseas department
  note: >-
    French Guiana is a french overseas department. French national drug law, including the Code de la
    santé publique prohibitions, is the applicable regime; there is no French Guiana-specific cannabis
    statute.
recreational: illegal
medical: limited
updated: '2026-11-15'
summary: >-
      French prohibition applies: cannabis use, possession and growing are criminal offences, and the
      only patient route is the restricted national French medical framework. Herb grown locally and
      imported is widely available; Cayenne airport checks target cocaine couriers to mainland France.
scores:
  possession: 1
  cultivation: 1
  enforcement: 3
  sharing: 1
  consumption: 1
  access: 1
segments:
  possession:
    text: >-
      Illicit use and possession fall under article L3421-1 of the Code de la santé publique: up
      to one year in prison and a €3,750 fine, with a national fixed-fine procedure for ordinary
      use cases.[@csp,sp_use]
    sources:
      - csp
      - sp_use
    currency: EUR
    penalties:
      - label: Ordinary illicit use
        treatment: criminal
        term: Drug use
        prison: 1 year
        fine: 3750
        note: National fixed-fine procedure applies to ordinary use cases
  cultivation:
    text: >-
      Growing cannabis is treated as production of narcotics: up to 20 years imprisonment and a
      €7.5 million fine, even for a few plants.[@cidj] In practice courts impose far lower
      sentences for small personal grows.[@cidj]
    sources:
      - cidj
    currency: EUR
    penalties:
      - label: Growing cannabis (production of narcotics)
        treatment: criminal
        term: Unlicensed cultivation
        prison: 20 years
        fine: 7500000
        note: Courts impose far lower sentences for small personal grows
  enforcement:
    text: >-
      The national law applies unchanged: ordinary use is handled mainly through fines, with the
      one-year prison maximum remaining available.[@cidj,csp]
    sources:
      - cidj
      - csp
  sharing:
    text: >-
      Giving cannabis to someone for their personal use is a specific offence with up to five
      years in prison under the national regime.[@cidj]
    sources:
      - cidj
  consumption:
    text: >-
      Ordinary illicit use is a criminal offence in public or private, with up to one year and
      €3,750; eligible ordinary-use cases can end through the national fixed-fine
      process.[@csp,sp_use] [France has punished any drug use with up to a year in prison since
      1970.](/history/france-use-criminalised-1970/) [Ordinary use moved into an on-the-spot fine in
      2020.](/history/france-fixed-fine-2020/)
    sources:
      - csp
      - sp_use
  access:
    text: >-
      There is no French Guiana-specific patient route; access follows the restricted national French
      medical framework, limited to patients carried over from the 2021 experiment during the
      transition to a permanent regime.[@sp] [France's medical cannabis experiment began in
      2021.](/history/france-medical-experiment-2021/)
    sources:
      - sp
context:
  recreational:
    text: >-
      There is no legal recreational supply. Cannabis, mostly herb, is widely accessible through
      local production and imports and remains the most commonly tried illegal drug.[@ofdt_gf]
      Ordinary illicit use is a criminal offence with up to one year in prison and a €3,750 fine.[@csp]
    sources:
      - ofdt_gf
      - csp
  production:
    status: none
    text: >-
      Herb is grown locally and imported from neighbouring countries; all of it is outside any
      legal regime, and growing is a production offence.[@ofdt_gf,cidj]
    sources:
      - ofdt_gf
      - cidj
  hemp:
    status: standard
    text: >-
      CBD flower and products under 0.3% THC are lawful to sell under the national French
      regime.[@cx] [France's top court allowed CBD flower sales in
      2022.](/history/france-cbd-flower-2022/)
    sources:
      - cx
  medical:
    text: >-
      No French Guiana-specific patient route exists; access follows the restricted national French
      medical framework.[@sp]
    sources:
      - sp
  consequences:
    text: >-
      Use and possession convictions carry up to one year in prison and a €3,750 fine under the
      national provisions, with convictions recorded under national criminal-record
      rules.[@csp]
    sources:
      - csp
  visitors:
    status: none
    text: >-
      There is no legal recreational supply for anyone. Ordinary illicit use is a criminal
      offence punishable by up to one year in prison and a €3,750 fine.[@csp,cidj]
    sources:
      - csp
      - cidj
  black_market:
    text: >-
      Herb dominates and sells at identified points of sale in Cayenne and elsewhere; a resin
      market is growing, supplied from Morocco through Europe, with resin sometimes exchanged for
      cocaine.[@ofdt_gf] The territory is a link in the South American cocaine route to Europe.[@ofdt_gf]
    sources:
      - ofdt_gf
  arrests:
    text: >-
      Controls at Cayenne's Félix-Éboué airport were reinforced to stop couriers, mostly young
      Guianese men carrying cocaine to mainland France, and the trafficking networks adapted their
      methods.[@ofdt_gf] No territory-wide cannabis arrest series was found in the reviewed sources.
    sources:
      - ofdt_gf
  driving:
    status: zero
    text: >-
      Driving after using a narcotic is an offence whatever the amount; there is no threshold, as
      in the rest of France.[@onisr]
    sources:
      - onisr
sources:
  ofdt_gf:
    title: OFDT — Drogues et conduites addictives en Guyane en 2024 (OUDOM, July 2025)
    url: https://www.ofdt.fr/publication/2025/drogues-et-conduites-addictives-en-guyane-en-2024-2549
    locator: >-
      Cannabis mainly herb, widely accessible thanks to local production and imports; resin market
      growing, from Morocco via Europe, exchanged against cocaine; Cayenne airport controls
      reinforced; regular cannabis use 3.8% (2014).
  cx:
    title: The Connexion — French court definitively allows sale of CBD flowers and products
    url: >-
      https://connexionfrance.com/French-news/French-court-definitively-allows-sale-of-CBD-flowers-and-products
  cidj:
    title: CIDJ — Détention de cannabis, je risque quoi ?
    url: https://www.cidj.com/vie-quotidienne/justice/detention-de-cannabis-je-risque-quoi
  csp:
    title: Légifrance — Code de la santé publique, article L3421-1, in force 20 August 2026
    url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000054724736/2026-08-20
    locator: One year and €3,750 for ordinary illicit use of a scheduled narcotic.
  sp_use:
    title: French government Service Public — drug-use penalties
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F33341
  sp:
    title: Service-Public.fr — Therapeutic cannabis
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F35817?lang=en
